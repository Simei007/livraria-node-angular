<main class="container mt-4">
    <h1 class="mb-4">Cadastro de Livro</h1>

    <form (ngSubmit)="incluir()">

        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" [(ngModel)]="livro.titulo" name="titulo" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Resumo</label>
            <textarea class="form-control" [(ngModel)]="livro.resumo" name="resumo" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Editora</label>
            <select class="form-select" [(ngModel)]="livro.codEditora" name="codEditora" required>
                <option *ngFor="let e of editoras" [value]="e.codEditora">
                    {{ e.nome }}
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Autores (separados por vírgula)</label>
            <input type="text" class="form-control" [(ngModel)]="autores" name="autores" required>
        </div>

        <button type="submit" class="btn btn-primary">
            Salvar Dados
        </button>

    </form>
</main>
